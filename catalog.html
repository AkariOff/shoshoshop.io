<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог - ShoshoShop</title>
    <meta name="description" content="Каталог товаров ShoshoShop">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="js/script.js"></script>
    <script src="js/telegram.js"></script>
</head>
<body>
    <!-- Навигация -->
    <nav class="nav-header" id="browser-nav">
        <div class="nav-container">
            <a href="index.html" class="logo">�️ ShoshoShop</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Главная</a>
                <a href="catalog.html" class="nav-link">Каталог</a>
                <a href="cart.html" class="nav-link cart-link">
                    Корзина
                    <span id="cart-counter" class="cart-counter">0</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="container" style="margin-top: 80px;">
        <div class="header">
            <h1>🛍️ Каталог товаров</h1>
            <p>Выберите категорию и найдите идеальный товар</p>
        </div>

        <!-- ✅ ДОБАВЛЕНО: Категории -->
        <div class="categories">
            <button class="category-btn active" data-category="all">
                <span>Все товары</span>
            </button>
            <button class="category-btn" data-category="clothing">
                <span>👕 Одежда</span>
            </button>
            <button class="category-btn" data-category="accessories">
                <span>💎 Аксессуары</span>
            </button>
            <button class="category-btn" data-category="shoes">
                <span>👟 Обувь</span>
            </button>
        </div>

        <!-- ✅ ДОБАВЛЕНО: Контейнер для товаров -->
        <div id="products-container" class="products-grid">
            <!-- Товары добавляются через JS -->
        </div>
    </main>

    <script src="js/script.js"></script>
    <script src="js/telegram.js"></script>
</body>
</html>
